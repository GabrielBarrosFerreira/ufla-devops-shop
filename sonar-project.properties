# SonarCloud (SonarQube Cloud) - SAST do ufla-devops-shop
# Confira os dois valores abaixo em: SonarCloud > seu projeto > Information
sonar.organization=gabrielbarrosferreira
sonar.projectKey=GabrielBarrosFerreira_ufla-devops-shop
sonar.projectName=ufla-devops-shop

# O que e codigo de producao e o que e teste
sonar.sources=app,static
sonar.tests=tests
sonar.python.version=3.12

# Cobertura gerada pelo pytest-cov no job "testes" (o front nao tem testes)
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=static/**

# O passo do pipeline ESPERA o resultado do Quality Gate e falha se ele reprovar
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
