server {
    listen 80;
    server_name localhost;
    # todo HTTP vira HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/loja.crt;
    ssl_certificate_key /etc/nginx/ssl/loja.key;

    location /static/ {
        alias /opt/ufla-shop/static/;
        expires 30d;
    }

    # a pagina inicial e um arquivo estatico: o Nginx serve direto do disco
    location = / {
        root /opt/ufla-shop/static;
        try_files /index.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}